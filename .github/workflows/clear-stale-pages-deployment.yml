name: Clear stale GitHub Pages deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  clear-stale-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Mark only the approved stale Pages deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stale_sha="305fc9d0c4cb5b625a1132d2b4b6a70dee4350d3"
          deployment_ids="$(gh api "repos/$GH_REPO/deployments?environment=github-pages&per_page=100" --jq ".[] | select(.sha == \"$stale_sha\" and .environment == \"github-pages\") | .id")"

          if [ -z "$deployment_ids" ]; then
            echo "No deployment found for $stale_sha"
            exit 1
          fi

          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            gh api --method POST "repos/$GH_REPO/deployments/$deployment_id/statuses" \
              -f state=inactive \
              -f description="Cleared stale GitHub Pages deployment lock"
            echo "Marked stale deployment $deployment_id inactive"
          done <<< "$deployment_ids"
